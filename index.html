const QUESTIONS=Object.entries(BANK).flatMap(([topic,rows])=>rows.map(([q,...opts],i)=>({id:topic+'-'+i,topic,q,opts,correct:0})));
let session=[],at=0,score=0,answered=false,selected=-1,mode='';const $=id=>document.getElementById(id);
let mistakes=new Set(JSON.parse(localStorage.getItem('infoMistakes')||'[]'));let history=JSON.parse(localStorage.getItem('infoHistory')||'[]');
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function show(id){['home','quiz','result'].forEach(x=>$(x).classList.toggle('hide',x!==id))}
function start(topic){mode=topic;session=shuffle(topic==='all'?QUESTIONS:topic==='mistakes'?QUESTIONS.filter(q=>mistakes.has(q.id)):QUESTIONS.filter(q=>q.topic===topic));if(!session.length){alert('Még nincs hibás kérdésed.');return}at=0;score=0;show('quiz');render()}
function render(){answered=false;selected=-1;const q=session[at];$('position').textContent=(at+1)+' / '+session.length;$('score').textContent='Helyes: '+score;$('progress').style.width=(100*at/session.length)+'%';$('category').textContent=q.topic;$('question').textContent=q.q;$('feedback').classList.add('hide');$('next').disabled=true;$('next').textContent=at===session.length-1?'Eredmény':'Következő';const options=shuffle(q.opts.map((text,i)=>({text,correct:i===q.correct})));$('answers').replaceChildren(...options.map((o,i)=>{const b=document.createElement('button');b.className='answer';b.textContent=String.fromCharCode(65+i)+'. '+o.text;b.onclick=()=>choose(i,options);return b}))}
function choose(i,options){if(answered)return;answered=true;selected=i;const q=session[at],good=options[i].correct;if(good){score++;mistakes.delete(q.id)}else mistakes.add(q.id);localStorage.setItem('infoMistakes',JSON.stringify([...mistakes]));[...$('answers').children].forEach((b,j)=>{b.disabled=true;if(options[j].correct)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});$('feedback').textContent=(good?'Helyes! ':'Nem jó. ')+ 'Helyes válasz: '+q.opts[q.correct];$('feedback').classList.remove('hide');$('next').disabled=false;$('score').textContent='Helyes: '+score}
function finish(){const pct=Math.round(score/session.length*100);history.push({date:new Date().toISOString(),mode,count:session.length,score,pct});localStorage.setItem('infoHistory',JSON.stringify(history.slice(-50)));$('resultScore').textContent=score+' / '+session.length+' ('+pct+'%)';$('resultText').textContent='Hibás kérdések száma ebben a körben: '+(session.length-score)+'. Ezeket külön újragyakorolhatod.';show('result')}
Object.entries(BANK).forEach(([topic,rows])=>{const b=document.createElement('button');b.className='topic';b.innerHTML=topic+'<small>'+rows.length+' kérdés</small>';b.onclick=()=>start(topic);$('topics').append(b)});
$('all').onclick=()=>start('all');$('mistakes').onclick=()=>start('mistakes');$('quit').onclick=()=>{show('home');updateStats()};$('next').onclick=()=>{if(!answered)return;if(++at>=session.length)finish();else render()};$('retry').onclick=()=>{show('home');updateStats()};function updateStats(){$('stats').textContent='Korábbi hibás kérdések: '+mistakes.size+' • Befejezett gyakorlások: '+history.length}updateStats();
</script></body></html>
